services:
  backend:
    build: ./ctf-backend
    restart: unless-stopped
    volumes:
      - db_data:/app/db
    env_file:
      - .env
    expose:
      - "8000"
  frontend:
    build: ./ctf-frontend
    volumes:
      - frontend_dist:/app/dist
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

volumes:
  db_data:
  frontend_dist: